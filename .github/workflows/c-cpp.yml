name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build firmware in devcontainer
      uses: devcontainers/ci@v0.3
      with:
        runCmd: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"$(nproc)"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rp2040-build
        path: build/*.uf2
